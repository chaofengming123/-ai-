spring.application.name=ai-knowledge-backend
server.address=127.0.0.1
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/ai_knowledge?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:ai_knowledge}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
mybatis-plus.configuration.map-underscore-to-camel-case=true

app.jwt.secret=${JWT_SECRET}

# 每次上传一个最多 1 MiB 的文档；请求上限给表单边界留空间。
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
app.documents.directory=${DOCUMENT_STORAGE_DIR:./uploads/documents}
app.documents.backend=${DOCUMENT_STORAGE_BACKEND:minio}
app.minio.endpoint=${MINIO_ENDPOINT:http://127.0.0.1:9000}
app.minio.access-key=${MINIO_ROOT_USER:}
app.minio.secret-key=${MINIO_ROOT_PASSWORD:}
app.minio.bucket=${MINIO_BUCKET:ai-knowledge-documents}

# 完整的 Chat Completions URL；未配置时明确返回 503，不提供模拟回复。
app.llm.endpoint=${LLM_ENDPOINT:https://open.bigmodel.cn/api/paas/v4/chat/completions}
app.llm.api-key=${LLM_API_KEY:}
app.llm.model=${LLM_MODEL:glm-4.7-flash}
app.llm.timeout-seconds=45
app.llm.token-parameter=${LLM_TOKEN_PARAMETER:max_tokens}
app.llm.thinking=${LLM_THINKING:disabled}
app.embedding.endpoint=${EMBEDDING_ENDPOINT:https://api.siliconflow.cn/v1/embeddings}
app.embedding.model=${EMBEDDING_MODEL:BAAI/bge-m3}
app.embedding.timeout-seconds=90
app.embedding.api-key=${EMBEDDING_API_KEY:}
app.rerank.endpoint=${RERANK_ENDPOINT:https://api.siliconflow.cn/v1/rerank}
app.rerank.model=${RERANK_MODEL:BAAI/bge-reranker-v2-m3}
app.rerank.api-key=${RERANK_API_KEY:}
app.rerank.timeout-seconds=45
app.qdrant.endpoint=${QDRANT_ENDPOINT:http://127.0.0.1:6333}
